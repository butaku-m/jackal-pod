name: JACKAL Timed Runner

on:
  workflow_dispatch:
    inputs:
      race_url:
        description: 'Target Race URL'
        required: false
        default: 'https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/DebaTable?k_raceDate=2026%2F10%2F20&k_raceNo=1&k_babaCode=36'
        type: string
      minutes_before:
        description: 'Minutes before race to notify'
        required: false
        default: '10'
        type: string

jobs:
  run-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz google-genai pandas tabulate lxml

      - name: Run timed runner
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RACE_URL: ${{ github.event.inputs.race_url || 'https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/DebaTable?k_raceDate=2026%2F10%2F20&k_raceNo=1&k_babaCode=36' }}
          MINUTES_BEFORE: ${{ github.event.inputs.minutes_before || '10' }}
        run: |
          python -u timed_runner.py

      - name: Upload Prediction Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jackal-prediction-logs
          path: logs/
          retention-days: 90

name: JACKAL Timed Runner

on:
  workflow_dispatch:
    inputs:
      race_url:
        description: 'Target Race URL'
        required: false
        default: 'https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/DebaTable?k_raceDate=2026%2F10%2F20&k_babaCode=22&k_raceNo=1' # 初回の起点URL
        type: string
      minutes_before:
        description: 'Minutes before race to notify'
        required: false
        default: '10'
        type: string

jobs:
  run-jackal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz

      - name: Run timed runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RACE_URL: ${{ github.event.inputs.race_url }}
          MINUTES_BEFORE: ${{ github.event.inputs.minutes_before }}
        run: |
          python timed_runner.py
